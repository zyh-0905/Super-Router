server:
  port: 8080
  read_timeout: 30s
  write_timeout: 0        # 0 = 不限：SSE 流式与长推理响应不能被 30s 写超时掐断
  read_header_timeout: 10s   # 慢速请求防护（P2-06）
  idle_timeout: 120s
  max_header_bytes: 1048576  # 1 MiB
  bootstrap_default_keys: false  # 生产关闭：空库时生成随机管理员 Key（仅日志打印一次）
  allowed_origins: []         # CORS 白名单；空 = 允许任意来源（本地开发）。生产建议填写可信前端域名
  metrics_token: ""           # 非空时 /metrics 需要 Authorization: Bearer <token>（P2-09）
  allow_private_upstream: false  # SSRF 防护：生产禁止私网/环回上游
  allow_http_upstream: false     # SSRF 防护：生产仅允许 https 上游

database:
  postgres:
    host: postgres
    port: 5432
    user: gateway
    password: gateway_pass
    dbname: smart_router
  redis:
    host: redis
    port: 6379
    password: ""
    db: 0

security:
  # 上游凭据信封加密密钥（base64 编码的 32 字节 AES-256 密钥）。
  # 生产请通过环境变量 SR_ENC_KEY 注入；生成方式：
  #   openssl rand -base64 32
  # 留空 = 明文存储（仅限本地开发，启动时会有安全告警）。
  encryption_key: ""

checker:
  alive_interval: 30s
  pricing_interval: 10m
  probe_interval: 1h
  balance_interval: 10m
  daily_probe_budget: 5.00
  probe_failed_backoff: 6h
  probe_model: "gpt-4o"       # 推理探针使用的模型（按站点实际可用模型调整）
  retention_days: 30          # 历史数据保留天数（健康/价格/探针/余额/请求/决策日志）

routing:
  default_strategy: custom_priority
  max_attempts: 3
  total_budget_ms: 30000
  retry_before_first_byte_only: true
  allow_emergency_pool: false
  tie_breaker: stable

  filter:
    max_price_cap: 100.0
    max_ttft_ms: 5000

  circuit_breaker:
    min_samples: 20
    open_failure_rate: 0.50
    open_min_failures: 5
    auth_failure_threshold: 3
    initial_cooling_seconds: 30
    max_cooling_seconds: 600
    cooling_backoff: [30, 60, 120, 300, 600]
    half_open_probe_count: 1
    recovery_success_threshold: 3

  balanced_weights:
    cost: 0.35
    reliability: 0.30
    latency: 0.25
    load: 0.10

logging:
  level: info
  format: json
