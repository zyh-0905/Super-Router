name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go build / vet / test / race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...

  frontend:
    name: Web lint / build / audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: eslint
        run: npm run lint
      - name: build
        run: npm run build
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  monitoring:
    name: Prometheus config / rules validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 与真实部署一致：同时挂载 prometheus.yml 与告警规则文件（P2-10）
      - name: promtool check config
        run: |
          docker run --rm -v "$PWD/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus promtool check config /etc/prometheus/prometheus.yml
      - name: promtool test rules
        run: |
          docker run --rm -v "$PWD:/etc/prometheus:ro" \
            prom/prometheus promtool test rules /etc/prometheus/prometheus-alerts.test.yml

  compose:
    name: docker compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config --quiet
