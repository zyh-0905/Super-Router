# Prometheus 配置文件
global:
  scrape_interval: 15s       # 默认抓取间隔
  evaluation_interval: 15s   # 规则评估间隔

  external_labels:
    cluster: 'smart-router'
    environment: 'production'

# Alertmanager 通知出口（P2-10）：
# docker compose --profile monitoring 或 start-monitoring.sh 都会启动 alertmanager:9093；
# 若单独运行 Prometheus 且无 Alertmanager，此处会重试告警投递但不影响抓取。
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - host.docker.internal:9093

# 抓取配置
scrape_configs:
  # Smart Router Gateway
  - job_name: 'smart-router-gateway'
    static_configs:
      - targets: ['host.docker.internal:8080']  # 如果 Prometheus 在 Docker 中运行
        # - targets: ['localhost:8080']          # 如果 Prometheus 直接运行在主机
        labels:
          service: 'gateway'
          component: 'api'

    # 抓取超时
    scrape_timeout: 10s

    # metrics 路径
    metrics_path: '/metrics'

    # 重新标记（可选）
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

# 告警规则
rule_files:
  - /etc/prometheus/alerts.yml
